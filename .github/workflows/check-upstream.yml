name: check-upstream

# Compare upstream Project Chrono release tags against the artifacts already
# published here, and build+publish anything missing that the current recipe
# supports. Missing versions outside the supported series (e.g. a new major
# that renamed the CMake module flags) produce a workflow warning and need a
# recipe update in scripts/build.sh before SUPPORTED is widened.
#
# Runs weekly, and also on every push to main so recipe updates take effect
# immediately instead of waiting for the next tick. Tag pushes and releases
# created by the workflow itself cannot re-trigger this (branch filter, and
# GITHUB_TOKEN-created events never start workflows), so there is no loop.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Overlapping checks (e.g. a push landing near the weekly tick) queue up
# instead of racing; publish.yml additionally serializes per release tag.
concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - name: Compare upstream releases against published artifacts
        id: diff
        run: |
          FLOOR="9.0.1"     # oldest upstream version this pipeline publishes
          SUPPORTED='^9\.'  # series the current recipe can build (10.x renamed the CMake flags)

          upstream=$(git ls-remote --refs --tags https://github.com/projectchrono/chrono.git \
                     | sed -n 's#.*\trefs/tags/##p' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          covered=$(git ls-remote --refs --tags "https://github.com/${GITHUB_REPOSITORY}.git" \
                    | sed -n 's#.*\trefs/tags/chrono-\(.*\)-ubuntu24\.04-r[0-9][0-9]*$#\1#p' | sort -u)
          echo "upstream releases:" $upstream
          echo "already published:" $covered

          buildable=()
          while IFS= read -r v; do
            [ -n "$v" ] || continue
            grep -qxF "$v" <<< "$covered" && continue
            [ "$(printf '%s\n%s\n' "$FLOOR" "$v" | sort -V | head -n1)" = "$FLOOR" ] || continue
            if [[ "$v" =~ $SUPPORTED ]]; then
              buildable+=("$v")
            else
              echo "::warning::upstream release $v has no published artifact but is outside the supported series ($SUPPORTED); update scripts/build.sh for it, then widen SUPPORTED here"
            fi
          done <<< "$upstream"

          matrix=$(printf '%s\n' "${buildable[@]}" | grep . | jq -Rcn '[inputs]') || matrix='[]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "will build: $matrix"

  build:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      chrono_ref: ${{ matrix.version }}
      version_label: ${{ matrix.version }}
      recipe_rev: r1
