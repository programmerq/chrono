name: publish

on:
  workflow_dispatch:
    inputs:
      chrono_ref:
        description: "Upstream Project Chrono git ref to build"
        default: "release/9.0"
        required: true
      version_label:
        description: "Upstream version label (goes into the tag)"
        default: "9.0.1"
        required: true
      recipe_rev:
        description: "Recipe revision (r1, r2, ...) - bump when rebuilding the same upstream version"
        default: "r1"
        required: true

permissions:
  contents: write

# One publish per tag at a time: the immutability guard runs ~30-40 minutes
# before the release step, so overlapping dispatches must be serialized.
concurrency:
  group: publish-${{ inputs.version_label }}-${{ inputs.recipe_rev }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      CHRONO_REF: ${{ inputs.chrono_ref }}
      VERSION_LABEL: ${{ inputs.version_label }}
      RECIPE_REV: ${{ inputs.recipe_rev }}
      JOBS: "4"
      TAG: chrono-${{ inputs.version_label }}-ubuntu24.04-${{ inputs.recipe_rev }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing release (releases are immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed: only a confirmed 404 means the release is absent.
          if response=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1); then
            echo "::error::Release $TAG already exists. Releases are immutable - bump recipe_rev instead."
            exit 1
          elif ! grep -q "HTTP 404" <<< "$response"; then
            echo "::error::Could not verify that release $TAG is absent: $response"
            exit 1
          fi
          set +e
          git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::Tag $TAG already exists. Releases are immutable - bump recipe_rev instead."
            exit 1
          elif [ "$rc" -ne 2 ]; then
            echo "::error::Could not check for existing tag $TAG (git ls-remote exit $rc)."
            exit 1
          fi
          echo "OK: no existing release or tag named $TAG"

      - name: Build + package
        run: bash scripts/build.sh build

      - name: Consume-test
        run: bash scripts/build.sh consume-test

      - name: Compose release notes
        run: bash scripts/build.sh notes > notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$TAG.tar.zst" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
